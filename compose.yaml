name: evryone-bot

services:
  bot:
    image: evryone-bot:local
    build:
      context: .
      target: runtime
    env_file:
      - .env
    environment:
      HEALTH_PORT: "8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).close()"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
    name: evryone-bot-data
